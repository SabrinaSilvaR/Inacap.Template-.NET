trigger:
  branches:
    include:
      - main
      - develop
      - release/*

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'

stages:
- stage: BuildAndTest
  displayName: 'Build, Architecture & Unit Tests'
  jobs:
  - job: CompileAndTest
    displayName: 'Dotnet Build & Test Suite'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK $(dotnetVersion)'
      inputs:
        packageType: 'sdk'
        version: $(dotnetVersion)
        includePreviewVersions: true

    - script: |
        dotnet --version
        dotnet --list-sdks
      displayName: 'Verify .NET SDK'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Solution Dependencies'
      inputs:
        command: 'restore'
        projects: 'template-csharp-net10-fastendpoints/FastEndpointsTemplate.sln'

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution ($(buildConfiguration))'
      inputs:
        command: 'build'
        projects: 'template-csharp-net10-fastendpoints/FastEndpointsTemplate.sln'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Execute All Test Suites (Unit, Architecture, Integration)'
      inputs:
        command: 'test'
        projects: 'template-csharp-net10-fastendpoints/tests/**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --logger trx'
        publishTestResults: true

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

- stage: Containerize
  displayName: 'Docker Build & Verification'
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: DockerBuild
    displayName: 'Build Production Docker Image'
    steps:
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: 'build'
        Dockerfile: 'template-csharp-net10-fastendpoints/Dockerfile'
        buildContext: 'template-csharp-net10-fastendpoints'
        tags: |
          $(Build.BuildId)
          latest
